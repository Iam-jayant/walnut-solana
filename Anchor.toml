# Must match ANCHOR_VERSION and SOLANA_CLI_VERSION in toolchain.versions.
[toolchain]
anchor_version = "1.0.2"
solana_version = "3.1.10"
package_manager = "pnpm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
walnut = "5EunnixqNofjZDMwZudttJCKq675d99dwjqR8jTcjea"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "pnpm exec ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""

[hooks]
