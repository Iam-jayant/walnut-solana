[localnet]
# Number of MPC nodes in the single localnet cluster (minimum 2).
nodes = 2
# Optional node IP overrides (default: 172.20.0.[100..(100 + nodes - 1)]).
nodes_ips = [
  [172, 20, 0, 100],
  [172, 20, 0, 101]
]
# Seconds to wait for the localnet to come online.
localnet_timeout_secs = 60
# Written by the init template; ignored by the CLI.
backends = ["Cerberus"]

# Cluster offsets for non-localnet testing (`arcium test --cluster devnet`).
# RPC URLs and wallets are configured in Anchor.toml [provider].
# Offsets are recorded per network in config/networks/ once selected.
#
# Devnet uses the shared Arcium devnet cluster (offset 456). Clients, tests, and
# the benchmark harness derive cluster PDAs from this offset; the MXE and comp
# def PDAs derive from the program id, not the offset. See docs/DEVNET_DEPLOY.md.
[clusters.devnet]
offset = 456

# Mainnet uses the shared Arcium mainnet cluster (offset 2026). Kept commented
# until mainnet deployment (Task 17/18) so it cannot affect devnet or CI.
# [clusters.mainnet]
# offset = 2026
