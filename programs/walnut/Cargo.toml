[package]
name = "walnut"
version = "0.1.0"
description = "Walnut-Solana: private lending on Solana coordinated with Arcium MPC"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "walnut"

[features]
# `legacy` holds the spike circuits, the public-amount lending path and the
# retired v1 supply flows. Devnet, localnet, tests and CI build with it. The
# mainnet build drops it (`--no-default-features`) and keeps only the
# confidential path. See docs/MAINNET_DEPLOY.md.
default = ["legacy"]
legacy = []
# Register computation definitions with a release URL and circuit hash instead
# of uploading circuit bytes on chain. Used by the mainnet build.
offchain-circuits = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "arcium-anchor/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

# Exact pins must match ARCIUM_VERSION and ANCHOR_VERSION in toolchain.versions.
# arcium-anchor 0.16.0 itself depends on anchor-lang =1.0.2.
[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
# Walnut accepts classic SPL Token only (wSOL native mint and Circle USDC);
# Token-2022 is out of v1 scope. The `token_2022` feature is enabled only because
# Anchor's `token::*` account-constraint codegen references
# `anchor_spl::token_2022` / `token_interface`; instructions still take
# `Program<Token>` and `Account<Mint>`, which reject Token-2022.
anchor-spl = { version = "=1.0.2", default-features = false, features = ["token", "token_2022"] }
arcium-client = { default-features = false, version = "=0.16.0" }
arcium-macros = "=0.16.0"
arcium-anchor = "=0.16.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
